<!DOCTYPE html>
<html lang="id" data-theme="day">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk — ARIEL WEB TOOLS</title>
    <style>
        /* ===========================
           TEMA
           =========================== */
        :root,
        [data-theme="day"] {
            --paper: #f4f1de;
            --paper-2: #fdf0cd;
            --yellow: #f4a261;
            --yellow-2: #e9c46a;
            --red: #e76f51;
            --red-2: #d90429;
            --ink: #000000;
            --text: #1a1a1a;
            --text-soft: #4a4a4a;
            --sh1: 6px 6px 0 #000;
            --sh2: 4px 4px 0 #000;
            --grid: rgba(0, 0, 0, 0.08);
            --bgc: rgba(0, 0, 0, 0.08);
            --bgcb: rgba(255, 255, 255, 0.35);
        }

        [data-theme="night"] {
            --paper: #0a0e1a;
            --paper-2: #131a2e;
            --yellow: #ffffff;
            --yellow-2: #ff3040;
            --red: #2563eb;
            --red-2: #ff3040;
            --ink: #ffffff;
            --text: #ffffff;
            --text-soft: #a0b3d6;
            --sh1: 6px 6px 0 #ff3040;
            --sh2: 4px 4px 0 #2563eb;
            --grid: rgba(255, 255, 255, 0.06);
            --bgc: rgba(255, 48, 64, 0.25);
            --bgcb: rgba(255, 255, 255, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', system-ui, sans-serif;
            background: var(--paper);
            color: var(--text);
            padding: 30px 16px 40px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, color 0.3s ease;
            z-index: 0;
        }

        [data-theme="day"] body {
            background-image:
                radial-gradient(circle at 20% 30%, rgba(244, 162, 97, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(231, 111, 81, 0.12) 0%, transparent 40%),
                radial-gradient(circle, var(--grid) 1.2px, transparent 1.5px);
            background-size: auto, auto, 16px 16px;
        }

        [data-theme="night"] body {
            background-image:
                radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(255, 48, 64, 0.12) 0%, transparent 45%),
                radial-gradient(circle, var(--grid) 1px, transparent 1.5px);
            background-size: auto, auto, 24px 24px;
        }

        /* ===========================
           BACKGROUND KARTU
           =========================== */
        .bg-cards {
            position: fixed; inset: 0;
            z-index: -1; overflow: hidden; pointer-events: none;
        }
        .bg-card {
            position: absolute;
            border: 2px solid var(--bgc);
            background: var(--bgcb);
            border-radius: 8px;
            opacity: 0.55;
        }
        .c1 { width: 90px; height: 130px; top: 8%; left: 6%; transform: rotate(-15deg); animation: d1 22s ease-in-out infinite; }
        .c2 { width: 70px; height: 100px; top: 20%; right: 8%; transform: rotate(22deg); animation: d2 26s ease-in-out infinite; }
        .c3 { width: 120px; height: 80px; top: 55%; left: 3%; transform: rotate(10deg); animation: d3 30s ease-in-out infinite; }
        .c4 { width: 100px; height: 140px; bottom: 15%; right: 5%; transform: rotate(-22deg); animation: d4 24s ease-in-out infinite; }
        .c5 { width: 60px; height: 60px; top: 40%; left: 48%; transform: rotate(45deg); animation: d5 18s ease-in-out infinite; border-radius: 50%; }
        .c6 { width: 80px; height: 110px; bottom: 8%; left: 40%; transform: rotate(18deg); animation: d6 28s ease-in-out infinite; }
        .c7 { width: 50px; height: 50px; top: 70%; right: 30%; transform: rotate(-30deg); animation: d1 20s ease-in-out infinite reverse; }

        @keyframes d1 { 0%, 100% { transform: rotate(-15deg) translate(0, 0); } 50% { transform: rotate(-25deg) translate(40px, -60px); } }
        @keyframes d2 { 0%, 100% { transform: rotate(22deg) translate(0, 0); } 50% { transform: rotate(12deg) translate(-50px, 50px); } }
        @keyframes d3 { 0%, 100% { transform: rotate(10deg) translate(0, 0); } 50% { transform: rotate(-8deg) translate(60px, 30px); } }
        @keyframes d4 { 0%, 100% { transform: rotate(-22deg) translate(0, 0); } 50% { transform: rotate(-12deg) translate(-40px, -50px); } }
        @keyframes d5 { 0%, 100% { transform: rotate(45deg) translate(0, 0) scale(1); } 50% { transform: rotate(225deg) translate(30px, -30px) scale(1.15); } }
        @keyframes d6 { 0%, 100% { transform: rotate(18deg) translate(0, 0); } 50% { transform: rotate(28deg) translate(-30px, -40px); } }

        /* ===========================
           ANIMASI
           =========================== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes deal {
            0%   { opacity: 0; transform: translateY(40px) rotate(-8deg) scale(0.85); }
            60%  { opacity: 1; transform: translateY(-6px) rotate(2deg) scale(1.03); }
            100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
        }
        @keyframes flt {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50%      { transform: translateY(-12px) rotate(1deg); }
        }
        @keyframes blink {
            0%, 42%, 58%, 100% { transform: translateY(-50%) scaleY(1); }
            50%               { transform: translateY(-50%) scaleY(0.08); }
        }
        @keyframes swayL { 0%, 100% { transform: rotate(18deg); } 50% { transform: rotate(26deg); } }
        @keyframes swayR { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(-26deg); } }
        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.85; }
            50%      { transform: translateX(-50%) scale(0.85); opacity: 0.6; }
        }
        @keyframes star { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }
        @keyframes spark { 0%, 100% { transform: scale(0.9) rotate(0deg); opacity: 0.8; } 50% { transform: scale(1.15) rotate(180deg); opacity: 1; } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px) rotate(-1deg); }
            40% { transform: translateX(8px) rotate(1deg); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        @keyframes tabSlide { 0% { transform: scaleX(0.8); opacity: 0; } 100% { transform: scaleX(1); opacity: 1; } }
        @keyframes contentIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===========================
           THEME SWITCH
           =========================== */
        .theme-switch {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            display: flex;
            border: 3px solid var(--ink);
            border-radius: 4px;
            background: var(--paper-2);
            box-shadow: var(--sh2);
            overflow: hidden;
            animation: fadeUp 0.5s ease backwards 0.5s;
        }
        .theme-switch button {
            border: none; background: transparent;
            color: var(--text);
            font-family: inherit; font-weight: 900; font-size: 0.72rem;
            letter-spacing: 2px; padding: 12px 14px;
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            text-transform: uppercase;
            transition: all 0.25s ease;
        }
        .theme-switch button svg { width: 16px; height: 16px; stroke-width: 3; }
        .theme-switch button.active {
            background: var(--red-2); color: #fff;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.3);
        }
        .theme-switch button:not(.active):hover { background: var(--yellow-2); color: var(--ink); }
        .theme-switch button + button { border-left: 3px solid var(--ink); }

        /* ===========================
           LOGIN LAYOUT
           =========================== */
        .login-wrap {
            max-width: 480px; width: 100%;
            margin: auto;
            position: relative; z-index: 1;
            display: flex; flex-direction: column; gap: 20px;
        }

        /* ===========================
           ROBOT MINI
           =========================== */
        .robot-mini {
            display: flex; justify-content: center;
            animation: deal 0.7s ease backwards 0.1s;
        }
        .robot-scene { position: relative; width: 200px; height: 240px; }
        .robot-figure { position: absolute; inset: 0; animation: flt 4s ease-in-out infinite; }
        .robot-scene::after {
            content: ""; position: absolute; bottom: 4px; left: 50%;
            transform: translateX(-50%);
            width: 120px; height: 16px;
            background: radial-gradient(ellipse at center, var(--ink) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
            opacity: 0.85;
        }
        .rb-head {
            position: absolute; top: 0; left: 50%;
            transform: translateX(-50%);
            width: 150px; height: 106px;
            background: linear-gradient(160deg, #ffd8a8 0%, var(--yellow) 45%, var(--yellow-2) 100%);
            border: 3.5px solid var(--ink);
            border-radius: 50% 50% 44% 44% / 52% 52% 48% 48%;
            z-index: 5;
            box-shadow:
                inset -12px -8px 0 -4px rgba(0, 0, 0, 0.13),
                inset 10px 6px 0 -6px rgba(255, 255, 255, 0.65),
                5px 5px 0 var(--ink),
                0 14px 24px rgba(0, 0, 0, 0.2);
        }
        [data-theme="night"] .rb-head {
            background: linear-gradient(160deg, #ffffff 0%, #e5ecf7 50%, #94a3b8 100%);
            box-shadow:
                inset -12px -8px 0 -4px rgba(37, 99, 235, 0.15),
                inset 10px 6px 0 -6px rgba(255, 255, 255, 0.95),
                5px 5px 0 var(--ink),
                0 0 24px rgba(255, 48, 64, 0.35),
                0 14px 24px rgba(0, 0, 0, 0.5);
        }
        .rb-ear {
            position: absolute; top: 50%;
            transform: translateY(-50%);
            width: 26px; height: 46px;
            background: linear-gradient(160deg, var(--red) 0%, var(--red-2) 100%);
            border: 3.5px solid var(--ink);
            border-radius: 50%;
            z-index: -1;
            box-shadow: inset -3px -5px 0 rgba(0, 0, 0, 0.25);
        }
        .rb-ear.left { left: -14px; }
        .rb-ear.right { right: -14px; }
        [data-theme="night"] .rb-ear { background: linear-gradient(160deg, #2563eb 0%, #1e40af 100%); }

        .rb-face {
            position: absolute; top: 18px; left: 50%;
            transform: translateX(-50%);
            width: 114px; height: 70px;
            background: linear-gradient(180deg, #1a1f3a 0%, #050810 100%);
            border: 3.5px solid var(--ink);
            border-radius: 18px;
            box-shadow:
                inset 0 -5px 0 rgba(255, 255, 255, 0.06),
                inset 0 4px 16px rgba(0, 0, 0, 0.85);
            overflow: hidden;
        }
        .rb-face::before {
            content: ""; position: absolute;
            top: -18px; left: -16px;
            width: 70px; height: 36px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), transparent);
            transform: rotate(-25deg);
            border-radius: 50%;
        }
        .rb-eye {
            position: absolute; top: 50%;
            transform: translateY(-50%);
            width: 15px; height: 38px;
            background: var(--yellow-2);
            border-radius: 9px;
            z-index: 2;
            animation: blink 4s ease-in-out infinite;
            box-shadow: 0 0 8px var(--yellow-2), 0 0 16px var(--yellow-2);
        }
        .rb-eye.left { left: 26px; }
        .rb-eye.right { right: 26px; }
        [data-theme="night"] .rb-eye {
            background: #60a5fa;
            box-shadow: 0 0 10px #60a5fa, 0 0 20px rgba(96, 165, 250, 0.7);
        }

        .rb-body {
            position: absolute; top: 100px; left: 50%;
            transform: translateX(-50%);
            width: 126px; height: 100px;
            background: linear-gradient(160deg, #ffd8a8 0%, var(--yellow) 45%, var(--yellow-2) 100%);
            border: 3.5px solid var(--ink);
            border-radius: 46% 46% 40% 40% / 34% 34% 70% 70%;
            z-index: 3;
            box-shadow:
                inset -12px -12px 0 -4px rgba(0, 0, 0, 0.13),
                inset 10px 6px 0 -6px rgba(255, 255, 255, 0.65),
                5px 5px 0 var(--ink),
                0 14px 24px rgba(0, 0, 0, 0.2);
        }
        [data-theme="night"] .rb-body {
            background: linear-gradient(160deg, #ffffff 0%, #e5ecf7 50%, #94a3b8 100%);
            box-shadow:
                inset -12px -12px 0 -4px rgba(37, 99, 235, 0.15),
                inset 10px 6px 0 -6px rgba(255, 255, 255, 0.95),
                5px 5px 0 var(--ink),
                0 0 24px rgba(37, 99, 235, 0.35),
                0 14px 24px rgba(0, 0, 0, 0.5);
        }
        .rb-body::after {
            content: ""; position: absolute;
            bottom: -8px; left: 50%;
            transform: translateX(-50%);
            width: 90px; height: 24px;
            background: linear-gradient(160deg, var(--red) 0%, var(--red-2) 100%);
            border: 3.5px solid var(--ink);
            border-radius: 50%;
            z-index: -1;
        }
        [data-theme="night"] .rb-body::after {
            background: linear-gradient(160deg, #ff3040 0%, #b91c1c 100%);
        }
        .rb-body::before {
            content: ""; position: absolute;
            top: 32px; left: 50%;
            transform: translateX(-50%);
            width: 46px; height: 12px;
            background: var(--red-2);
            border: 2.5px solid var(--ink);
            border-radius: 8px;
            box-shadow: 0 0 8px var(--red-2);
        }
        [data-theme="night"] .rb-body::before {
            background: #ff3040;
            box-shadow: 0 0 12px #ff3040, 0 0 24px rgba(255, 48, 64, 0.5);
        }

        .rb-arm {
            position: absolute; top: 116px;
            width: 40px; height: 70px;
            background: linear-gradient(160deg, #ffd8a8 0%, var(--yellow) 45%, var(--yellow-2) 100%);
            border: 3.5px solid var(--ink);
            border-radius: 46% 46% 40% 40% / 34% 34% 66% 66%;
            z-index: 2;
            box-shadow:
                inset -8px -10px 0 -4px rgba(0, 0, 0, 0.13),
                inset 6px 3px 0 -5px rgba(255, 255, 255, 0.65);
            transform-origin: top center;
        }
        [data-theme="night"] .rb-arm {
            background: linear-gradient(160deg, #ffffff 0%, #e5ecf7 50%, #94a3b8 100%);
        }
        .rb-arm.left { left: 0; animation: swayL 4s ease-in-out infinite; }
        .rb-arm.right { right: 0; animation: swayR 4s ease-in-out infinite; }

        .rb-claw {
            position: absolute; bottom: -11px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 3px; align-items: flex-end;
        }
        .rb-claw span {
            width: 6px; height: 14px;
            background: var(--ink);
            border-radius: 3px 3px 4px 4px;
        }
        .rb-claw span:nth-child(1) { transform: rotate(-14deg); height: 12px; }
        .rb-claw span:nth-child(2) { height: 16px; }
        .rb-claw span:nth-child(3) { transform: rotate(14deg); height: 12px; }

        .rb-star {
            position: absolute; top: -8px; right: 12px;
            width: 34px; height: 34px;
            background: var(--red-2);
            border: 2.5px solid var(--ink);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: star 6s linear infinite;
            z-index: 10;
            filter: drop-shadow(2px 2px 0 var(--ink));
        }

        /* ===========================
           KARTU LOGIN
           =========================== */
        .login-card {
            background: var(--paper-2);
            border: 3px solid var(--ink);
            border-radius: 4px;
            padding: 26px 24px;
            position: relative;
            box-shadow: var(--sh1);
            overflow: hidden;
            animation: deal 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) backwards 0.25s;
        }
        .login-card::before {
            content: ""; position: absolute;
            top: 6px; left: 6px;
            width: 14px; height: 14px;
            border-top: 3px solid var(--red-2);
            border-left: 3px solid var(--red-2);
            pointer-events: none;
        }
        .login-card::after {
            content: ""; position: absolute;
            bottom: 6px; right: 6px;
            width: 14px; height: 14px;
            border-bottom: 3px solid var(--red);
            border-right: 3px solid var(--red);
            pointer-events: none;
        }
        .login-card.shake { animation: shake 0.5s ease; }

        .sparkle {
            position: absolute; width: 18px; height: 18px;
            background: var(--red-2);
            clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
            animation: spark 3s ease-in-out infinite;
            pointer-events: none; z-index: 2;
        }
        .sparkle.s1 { top: 12px; right: 14px; }
        .sparkle.s2 { top: 14px; right: 36px; width: 12px; height: 12px; animation-delay: 0.5s; background: var(--red); }

        /* ===========================
           TABS
           =========================== */
        .tabs {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 0;
            border: 3px solid var(--ink);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 22px;
            box-shadow: var(--sh2);
            background: var(--paper);
        }
        .tab-btn {
            padding: 14px 10px;
            background: var(--paper);
            color: var(--text-soft);
            border: none;
            font-family: inherit; font-weight: 900; font-size: 0.82rem;
            letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; transition: all 0.25s ease;
            position: relative;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .tab-btn svg { width: 16px; height: 16px; stroke-width: 3; stroke: currentColor; fill: none; }
        .tab-btn + .tab-btn { border-left: 3px solid var(--ink); }
        .tab-btn.active {
            background: var(--yellow-2);
            color: var(--ink);
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.1);
        }
        [data-theme="night"] .tab-btn.active { background: #ff3040; color: #fff; }
        .tab-btn:not(.active):hover { background: var(--yellow-2); color: var(--ink); }
        [data-theme="night"] .tab-btn:not(.active):hover { background: #2563eb; color: #fff; }
        .tab-btn.active::after {
            content: ""; position: absolute;
            bottom: 0; left: 20%; right: 20%;
            height: 3px; background: var(--ink);
            animation: tabSlide 0.35s ease;
        }
        [data-theme="night"] .tab-btn.active::after { background: #fff; }

        /* ===========================
           FORM
           =========================== */
        .form-panel { display: none; animation: contentIn 0.4s ease; }
        .form-panel.active { display: block; }

        .panel-subtitle {
            font-size: 0.72rem;
            color: var(--text-soft);
            letter-spacing: 2px; text-transform: uppercase; font-weight: 800;
            padding-bottom: 14px;
            margin-bottom: 20px;
            border-bottom: 3px dashed var(--ink);
        }

        .field { margin-bottom: 16px; }
        .field label {
            display: block;
            font-size: 0.68rem;
            letter-spacing: 2.5px; text-transform: uppercase;
            color: var(--ink); font-weight: 900;
            margin-bottom: 8px;
            background: var(--yellow-2);
            border: 2px solid var(--ink);
            padding: 2px 8px;
            width: fit-content;
            transform: rotate(-1deg);
        }
        [data-theme="night"] .field label { background: #ff3040; color: #fff; border-color: #fff; }

        .field input {
            width: 100%;
            padding: 14px 16px;
            border: 3px solid var(--ink);
            border-radius: 4px;
            background: var(--paper);
            color: var(--text);
            font-size: 0.92rem;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit; font-weight: 700;
            box-shadow: var(--sh2);
        }
        .field input::placeholder { color: var(--text-soft); font-weight: 500; }
        .field input:focus {
            background: var(--paper-2);
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--ink);
        }

        .pass-wrap { position: relative; }
        .pass-wrap input { padding-right: 52px; }
        .pass-toggle {
            position: absolute; right: 8px; top: 50%;
            transform: translateY(-50%);
            background: var(--yellow-2);
            border: 2.5px solid var(--ink);
            border-radius: 4px;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 2px 2px 0 var(--ink);
            transition: all 0.15s ease;
        }
        [data-theme="night"] .pass-toggle { background: #2563eb; }
        .pass-toggle:active { transform: translateY(-50%) translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
        .pass-toggle svg { width: 18px; height: 18px; stroke-width: 3; stroke: var(--ink); }
        [data-theme="night"] .pass-toggle svg { stroke: #fff; }

        .remember {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; user-select: none;
            color: var(--text);
            font-size: 0.75rem; font-weight: 800;
            letter-spacing: 1px; text-transform: uppercase;
            margin-bottom: 20px;
        }
        .remember input { display: none; }
        .checkbox-box {
            width: 20px; height: 20px;
            border: 3px solid var(--ink);
            border-radius: 4px;
            background: var(--paper);
            box-shadow: 2px 2px 0 var(--ink);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .checkbox-box svg {
            width: 14px; height: 14px;
            stroke: var(--ink); stroke-width: 4;
            opacity: 0; transition: opacity 0.2s ease;
        }
        .remember input:checked + .checkbox-box { background: var(--yellow-2); }
        [data-theme="night"] .remember input:checked + .checkbox-box { background: #ff3040; }
        .remember input:checked + .checkbox-box svg { opacity: 1; }
        [data-theme="night"] .remember input:checked + .checkbox-box svg { stroke: #fff; }

        .btn-submit {
            width: 100%;
            padding: 16px 24px;
            border: 3px solid var(--ink);
            border-radius: 4px;
            background: var(--red-2);
            color: #fff;
            font-weight: 900; font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            font-family: inherit;
            letter-spacing: 3px; text-transform: uppercase;
            box-shadow: var(--sh2);
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.3);
        }
        [data-theme="night"] .btn-submit { background: #ff3040; box-shadow: 4px 4px 0 #2563eb; }
        .btn-submit:hover {
            background: var(--red);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--ink);
        }
        [data-theme="night"] .btn-submit:hover { background: #dc2626; box-shadow: 6px 6px 0 #2563eb; }
        .btn-submit:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .btn-submit .loader {
            display: none;
            width: 16px; height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .btn-submit.loading .loader { display: inline-block; }

        /* ===========================
           ALERT
           =========================== */
        .alert {
            padding: 12px 16px;
            border: 3px solid var(--ink);
            border-radius: 4px;
            font-size: 0.78rem; font-weight: 900;
            text-align: center; letter-spacing: 1px;
            box-shadow: var(--sh2);
            margin-bottom: 16px;
            text-transform: uppercase;
            animation: deal 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .alert.error {
            background: var(--red); color: #fff;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.3);
        }
        [data-theme="night"] .alert.error { background: #ff3040; box-shadow: 4px 4px 0 #2563eb; }
        .alert.success { background: var(--yellow-2); color: var(--ink); }
        [data-theme="night"] .alert.success { background: #2563eb; color: #fff; box-shadow: 4px 4px 0 #ff3040; }
        .hidden { display: none !important; }

        /* ===========================
           FOOTER
           =========================== */
        .dev-footer {
            margin-top: 30px;
            display: flex; justify-content: center;
            position: relative; z-index: 1;
        }
        .dev-card {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 26px;
            background: var(--yellow);
            border: 3px solid var(--ink);
            border-radius: 4px;
            box-shadow: var(--sh1);
            animation: deal 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) backwards 0.6s;
        }
        [data-theme="night"] .dev-card { background: #ff3040; }

        .grad-cap {
            width: 46px; height: 46px;
            display: flex; align-items: center; justify-content: center;
            border: 3px solid var(--ink);
            border-radius: 4px;
            background: var(--paper-2);
            flex-shrink: 0;
            box-shadow: 3px 3px 0 var(--ink);
        }
        .grad-cap svg { width: 28px; height: 28px; }
        .grad-cap svg path,
        .grad-cap svg line,
        .grad-cap svg circle { stroke: var(--ink); }
        .grad-cap svg path[fill="none"] { fill: none; }

        .dev-info { display: flex; flex-direction: column; line-height: 1.3; }
        .dev-label {
            font-size: 0.66rem;
            letter-spacing: 2.5px; text-transform: uppercase;
            color: var(--ink); font-weight: 800; opacity: 0.85;
        }
        .dev-name {
            font-size: 1.1rem; font-weight: 900;
            letter-spacing: 1px; color: var(--ink);
            text-transform: uppercase;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.15);
        }
        [data-theme="night"] .dev-label,
        [data-theme="night"] .dev-name { color: #fff; }

        /* ===========================
           RESPONSIVE
           =========================== */
        @media (max-width: 560px) {
            .theme-switch { top: 14px; right: 14px; }
            .theme-switch button { padding: 10px; font-size: 0.65rem; }
            .theme-switch button svg { width: 14px; height: 14px; }
            .login-card { padding: 22px 18px; }
            .tab-btn { font-size: 0.72rem; padding: 12px 6px; letter-spacing: 1px; }
            .dev-card { padding: 12px 20px; }
            .grad-cap { width: 40px; height: 40px; }
            .grad-cap svg { width: 26px; height: 26px; }
        }
    </style>
</head>
<body>

    <div class="bg-cards">
        <div class="bg-card c1"></div>
        <div class="bg-card c2"></div>
        <div class="bg-card c3"></div>
        <div class="bg-card c4"></div>
        <div class="bg-card c5"></div>
        <div class="bg-card c6"></div>
        <div class="bg-card c7"></div>
    </div>

    <div class="theme-switch">
        <button id="btnDay" class="active" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            Siang
        </button>
        <button id="btnNight" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            Malam
        </button>
    </div>

    <div class="login-wrap">
        <div class="robot-mini">
            <div class="robot-scene">
                <div class="robot-figure">
                    <div class="rb-star"></div>
                    <div class="rb-head">
                        <div class="rb-ear left"></div>
                        <div class="rb-ear right"></div>
                        <div class="rb-face">
                            <div class="rb-eye left"></div>
                            <div class="rb-eye right"></div>
                        </div>
                    </div>
                    <div class="rb-body"></div>
                    <div class="rb-arm left"><div class="rb-claw"><span></span><span></span><span></span></div></div>
                    <div class="rb-arm right"><div class="rb-claw"><span></span><span></span><span></span></div></div>
                </div>
            </div>
        </div>

        <section class="login-card" id="loginCard">
            <span class="sparkle s1"></span>
            <span class="sparkle s2"></span>

            <div class="tabs">
                <button class="tab-btn active" id="tabLogin" type="button">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>
                    Login
                </button>
                <button class="tab-btn" id="tabRegister" type="button">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <line x1="19" y1="8" x2="19" y2="14" />
                        <line x1="22" y1="11" x2="16" y2="11" />
                    </svg>
                    Registrasi
                </button>
            </div>

            <div id="alertBox" class="alert hidden"></div>

            <div class="form-panel active" id="panelLogin">
                <div class="panel-subtitle">Masuk ke akun Anda</div>
                <form id="loginForm" novalidate>
                    <div class="field">
                        <label for="loginUsername">Username</label>
                        <input type="text" id="loginUsername" placeholder="username" autocomplete="username" required />
                    </div>
                    <div class="field">
                        <label for="loginPassword">Password</label>
                        <div class="pass-wrap">
                            <input type="password" id="loginPassword" placeholder="password" autocomplete="current-password" required />
                            <button type="button" class="pass-toggle" data-target="loginPassword">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <label class="remember">
                        <input type="checkbox" id="remember" />
                        <span class="checkbox-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12" />
                            </svg>
                        </span>
                        Ingat saya
                    </label>
                    <button type="submit" class="btn-submit" id="loginBtn">
                        <span>MASUK</span>
                        <span class="loader"></span>
                    </button>
                </form>
            </div>

            <div class="form-panel" id="panelRegister">
                <div class="panel-subtitle">Buat akun baru</div>
                <form id="registerForm" novalidate>
                    <div class="field">
                        <label for="regUsername">Username</label>
                        <input type="text" id="regUsername" placeholder="minimal 3 karakter" autocomplete="off" required />
                    </div>
                    <div class="field">
                        <label for="regPassword">Password</label>
                        <div class="pass-wrap">
                            <input type="password" id="regPassword" placeholder="minimal 5 karakter" autocomplete="new-password" required />
                            <button type="button" class="pass-toggle" data-target="regPassword">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="field">
                        <label for="regConfirm">Konfirmasi Password</label>
                        <div class="pass-wrap">
                            <input type="password" id="regConfirm" placeholder="ulangi password" autocomplete="new-password" required />
                            <button type="button" class="pass-toggle" data-target="regConfirm">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" id="registerBtn">
                        <span>DAFTAR</span>
                        <span class="loader"></span>
                    </button>
                </form>
            </div>
        </section>
    </div>

    <footer class="dev-footer">
        <div class="dev-card">
            <div class="grad-cap">
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M32 12 L58 24 L32 36 L6 24 Z" stroke-width="2" stroke-linejoin="round" />
                    <path d="M18 30 V42 C18 42 24 48 32 48 C40 48 46 42 46 42 V30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                    <line x1="56" y1="25" x2="56" y2="40" stroke-width="3" stroke-linecap="round" />
                    <circle cx="56" cy="43" r="3.5" fill="none" stroke-width="2" />
                </svg>
            </div>
            <div class="dev-info">
                <span class="dev-label">Developed by</span>
                <span class="dev-name">Dev Ariel</span>
            </div>
        </div>
    </footer>

    <script>
        /* API_BASE kosong = pakai domain yang sama */
        const API_BASE = "";

        /* ===========================
           THEME
           =========================== */
        const htmlEl = document.documentElement;
        const btnDay = document.getElementById("btnDay");
        const btnNight = document.getElementById("btnNight");

        const savedTheme = localStorage.getItem("ariel-theme") || "day";
        applyTheme(savedTheme);

        function applyTheme(theme) {
            htmlEl.setAttribute("data-theme", theme);
            localStorage.setItem("ariel-theme", theme);
            const isDay = theme === "day";
            btnDay.classList.toggle("active", isDay);
            btnNight.classList.toggle("active", !isDay);
        }
        btnDay.addEventListener("click", () => applyTheme("day"));
        btnNight.addEventListener("click", () => applyTheme("night"));

        /* ===========================
           ELEMEN
           =========================== */
        const tabLogin = document.getElementById("tabLogin");
        const tabRegister = document.getElementById("tabRegister");
        const panelLogin = document.getElementById("panelLogin");
        const panelRegister = document.getElementById("panelRegister");
        const alertBox = document.getElementById("alertBox");
        const loginCard = document.getElementById("loginCard");

        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");
        const loginBtn = document.getElementById("loginBtn");
        const registerBtn = document.getElementById("registerBtn");

        const loginUsername = document.getElementById("loginUsername");
        const loginPassword = document.getElementById("loginPassword");
        const remember = document.getElementById("remember");

        const regUsername = document.getElementById("regUsername");
        const regPassword = document.getElementById("regPassword");
        const regConfirm = document.getElementById("regConfirm");

        /* ===========================
           TAB SWITCH
           =========================== */
        function switchTab(name) {
            hideAlert();
            if (name === "login") {
                tabLogin.classList.add("active");
                tabRegister.classList.remove("active");
                panelLogin.classList.add("active");
                panelRegister.classList.remove("active");
            } else {
                tabRegister.classList.add("active");
                tabLogin.classList.remove("active");
                panelRegister.classList.add("active");
                panelLogin.classList.remove("active");
            }
        }
        tabLogin.addEventListener("click", () => switchTab("login"));
        tabRegister.addEventListener("click", () => switchTab("register"));

        /* ===========================
           ALERT HELPER
           =========================== */
        function showAlert(text, type) {
            alertBox.textContent = text;
            alertBox.className = "alert " + type;
        }
        function hideAlert() { alertBox.className = "alert hidden"; }
        function shakeCard() {
            loginCard.classList.add("shake");
            setTimeout(() => loginCard.classList.remove("shake"), 500);
        }

        /* ===========================
           PASSWORD TOGGLE
           =========================== */
        document.querySelectorAll(".pass-toggle").forEach(btn => {
            btn.addEventListener("click", () => {
                const input = document.getElementById(btn.dataset.target);
                const hidden = input.type === "password";
                input.type = hidden ? "text" : "password";
                const svg = btn.querySelector("svg");
                svg.innerHTML = hidden
                    ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
                    : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
            });
        });

        /* ===========================
           REMEMBER USERNAME
           =========================== */
        const savedUser = localStorage.getItem("ariel-remember-user");
        if (savedUser) {
            loginUsername.value = savedUser;
            remember.checked = true;
        }

        /* ===========================
           API HELPER
           =========================== */
        async function apiPost(path, body) {
            const res = await fetch(API_BASE + path, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            return res.json();
        }

        /* ===========================
           LOGIN SUBMIT
           =========================== */
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            hideAlert();

            const username = loginUsername.value.trim();
            const password = loginPassword.value;

            if (!username || !password) {
                showAlert("Username & password wajib diisi", "error");
                shakeCard();
                return;
            }

            loginBtn.classList.add("loading");
            loginBtn.disabled = true;

            const users = JSON.parse(localStorage.getItem("ariel-users") || "{}");

            if (!users[username] || users[username] !== password) {
                try { await apiPost("/api/login", { username, password }); } catch(err) {}
                showAlert("Username atau password salah", "error");
                shakeCard();
                loginBtn.classList.remove("loading");
                loginBtn.disabled = false;
                return;
            }

            try { await apiPost("/api/login", { username, password }); } catch(err) {}

            sessionStorage.setItem("ariel-logged", "1");
            sessionStorage.setItem("ariel-user", username);

            if (remember.checked) {
                localStorage.setItem("ariel-remember-user", username);
            } else {
                localStorage.removeItem("ariel-remember-user");
            }

            showAlert("Berhasil! Mengalihkan...", "success");

            setTimeout(() => {
                window.location.href = "/tools";
            }, 800);
        });

        /* ===========================
           REGISTER SUBMIT
           =========================== */
        registerForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            hideAlert();

            const username = regUsername.value.trim();
            const password = regPassword.value;
            const confirm = regConfirm.value;

            if (!username || !password || !confirm) {
                showAlert("Semua field wajib diisi", "error");
                shakeCard();
                return;
            }
            if (username.length < 3) {
                showAlert("Username minimal 3 karakter", "error");
                shakeCard();
                return;
            }
            if (password.length < 5) {
                showAlert("Password minimal 5 karakter", "error");
                shakeCard();
                return;
            }
            if (password !== confirm) {
                showAlert("Konfirmasi password tidak cocok", "error");
                shakeCard();
                return;
            }

            registerBtn.classList.add("loading");
            registerBtn.disabled = true;

            const users = JSON.parse(localStorage.getItem("ariel-users") || "{}");

            if (users[username]) {
                showAlert("Username sudah terdaftar", "error");
                shakeCard();
                registerBtn.classList.remove("loading");
                registerBtn.disabled = false;
                return;
            }

            try {
                const data = await apiPost("/api/register", { username, password });
                if (!data.success) {
                    showAlert(data.message || "Registrasi gagal", "error");
                    shakeCard();
                    registerBtn.classList.remove("loading");
                    registerBtn.disabled = false;
                    return;
                }
            } catch (err) {
                console.error(err);
                showAlert("Server tidak merespon", "error");
                shakeCard();
                registerBtn.classList.remove("loading");
                registerBtn.disabled = false;
                return;
            }

            users[username] = password;
            localStorage.setItem("ariel-users", JSON.stringify(users));

            showAlert("Registrasi berhasil! Silakan login", "success");

            setTimeout(() => {
                switchTab("login");
                loginUsername.value = username;
                loginPassword.value = "";
                loginPassword.focus();
                registerForm.reset();
                registerBtn.classList.remove("loading");
                registerBtn.disabled = false;
            }, 900);
        });
    </script>
</body>
</html>
